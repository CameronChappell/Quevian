name: Apply and verify key privacy
on:
  push:
    branches: [security/api-key-privacy-2026-09-22]
    paths: [.github/workflows/apply-key-privacy.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  apply:
    if: github.repository == 'CameronChappell/Quevian' && github.ref == 'refs/heads/security/api-key-privacy-2026-09-22'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply source-hash-guarded edits without installing dependencies
        run: |
          node scripts/apply-api-key-privacy.mjs
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == {'components/queuepilot/completion.tsx','components/queuepilot/advanced.tsx','components/queuepilot/workspace.tsx','vite.config.ts','vite.pages.config.ts'}, changed
          PY
      - name: Commit only the reviewed display and build edits
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- components/queuepilot/completion.tsx components/queuepilot/advanced.tsx components/queuepilot/workspace.tsx vite.config.ts vite.pages.config.ts
          git commit -m 'Hide integration key values and ordinary-user controls; enforce browser credential boundaries'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/security/api-key-privacy-2026-09-22
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Validate exact edited source, all tests and public output
        run: |
          git rev-parse HEAD
          npx tsc --noEmit --pretty false
          npm test
          npx vite build --config vite.pages.config.ts
          node --input-type=module -e "import {scanPublicDirectory} from './build/client-security.mjs'; scanPublicDirectory('dist/client'); scanPublicDirectory('pages-dist'); console.log('Client and public output credential checks passed.');"
          npm audit --omit=dev --audit-level=high
