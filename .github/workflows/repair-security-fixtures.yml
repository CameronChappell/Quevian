name: Repair and verify security release
on:
  push:
    branches: [security/2026-09-22-hardening]
    paths: [.github/workflows/repair-security-fixtures.yml]
permissions:
  contents: read
concurrency:
  group: repair-security-release
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'CameronChappell/Quevian' && github.ref == 'refs/heads/security/2026-09-22-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply reviewed migration without installing dependencies
        run: |
          node scripts/repair-security-fixtures.mjs
          node --check tests/workspace.test.mjs
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == {'tests/workspace.test.mjs','lib/server/files.ts'}, changed
          PY
      - name: Commit only the reviewed source changes
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/workspace.test.mjs lib/server/files.ts
          git commit -m 'Repair verified-email and paid-workspace fixtures; retain upload rollback on concurrent revocation'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/security/2026-09-22-hardening
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.repair.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Validate the committed release
        run: |
          mkdir -p "$RUNNER_TEMP/verified-security"
          git rev-parse HEAD | tee "$RUNNER_TEMP/verified-security/commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/verified-security/source.tar.gz"
          npx tsc --noEmit --pretty false
          node --test tests/security-policy.test.mjs tests/security-limits.test.mjs
          npm test 2>&1 | tee "$RUNNER_TEMP/verified-security/tests.log"
          npm run build
      - name: Retain exact source and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-security-source
          path: ${{ runner.temp }}/verified-security
          retention-days: 3
