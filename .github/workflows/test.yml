name: Verify Quevian
on:
  push:
    branches: [main, security/2026-09-22-hardening]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Security regression tests
        run: node --test tests/security-policy.test.mjs tests/security-limits.test.mjs
      - run: npm test
