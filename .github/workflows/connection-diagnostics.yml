name: Trace existing Quevian publishing connection
on:
  push:
    branches: [diagnostics/quevian-publishing-connection-2026-09-22]
    paths: [.github/workflows/connection-diagnostics.yml]
permissions: {}
jobs:
  public-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public DNS and unauthenticated website metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, re, urllib.request, urllib.error, urllib.parse
          from html.parser import HTMLParser
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__(); self.paths=set()
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  path=attrs.get('src') if tag=='script' else attrs.get('href') if tag=='link' else None
                  if path:
                      parsed=urllib.parse.urlsplit(path)
                      if parsed.path.endswith(('.js','.css')): self.paths.add(parsed.path)
          def request(url):
              opener=urllib.request.build_opener(NoRedirect)
              try: return opener.open(urllib.request.Request(url,headers={'User-Agent':'Quevian-public-connection-diagnostics/1.0'}),timeout=12)
              except urllib.error.HTTPError as error: return error
          dns=[('dns',name,kind) for name,kind in [('quevian.com','A'),('quevian.com','NS'),('quevian.com','CNAME'),('www.quevian.com','CNAME'),('queuepilot.boomacooks.chatgpt.site','A')]]
          pages=[('page',url,'') for url in ['http://quevian.com/','https://quevian.com/','https://quevian.com/login','https://quevian.com/api/account','https://queuepilot.boomacooks.chatgpt.site/','https://cameronchappell.github.io/Quevian/']]
          allowed=['server','content-type','strict-transport-security','x-content-type-options','content-security-policy','cache-control','x-powered-by','x-github-request-id']
          def inspect(item):
              kind,target,query=item
              result={'kind':kind,'target':target}
              try:
                  url='https://dns.google/resolve?'+urllib.parse.urlencode({'name':target,'type':query}) if kind=='dns' else target
                  with request(url) as response:
                      result['http_status']=response.code
                      body=response.read(1500000)
                      if kind=='dns':
                          data=json.loads(body);result.update(type=query,dns_status=data.get('Status'),answers=data.get('Answer',[]))
                      else:
                          result['headers']={name:response.headers.get(name) for name in allowed if response.headers.get(name)}
                          location=response.headers.get('location')
                          if location:
                              parsed=urllib.parse.urlsplit(urllib.parse.urljoin(url,location))
                              result['redirect']=urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,parsed.path,'',''))
                          if 'text/html' in response.headers.get('content-type','') and response.code==200:
                              parser=Assets(); text=body.decode('utf8',errors='replace');parser.feed(text)
                              result['assets']=sorted(parser.paths)
                              result['quevian_brand_present']='quevian' in text.lower()
                              result['homepage_demo_present']='product-preview' in text
                          result['response_bytes']=len(body)
              except Exception as error:
                  result['error_type']=type(error).__name__
                  result['reason_type']=type(getattr(error,'reason',None)).__name__
              return result
          print(json.dumps({'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Public DNS and no-cookie GET only; no secrets, account writes, deployment, or DNS edits.'}))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for result in pool.map(inspect,dns+pages): print(json.dumps(result))
          PY
