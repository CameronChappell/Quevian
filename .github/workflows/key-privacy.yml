name: API key privacy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: api-key-privacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Verify redacted credential-detection rules
        run: node --test tests/client-secrets.test.mjs
      - name: Build and inspect the public marketing output
        run: |
          npx vite build --config vite.pages.config.ts
          node --input-type=module -e "import {scanPublicDirectory} from './build/client-security.mjs'; scanPublicDirectory('pages-dist'); console.log('Public build credential checks passed.');"
