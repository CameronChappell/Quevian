name: Security audit
on:
  push:
    branches: [main, security/2026-09-22-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable Git history without logging secret values
        shell: bash
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all' --redact=100 --max-decode-depth=2 \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" --no-banner \
            >"$RUNNER_TEMP/gitleaks-private.log" 2>&1
          status=$?
          export SCAN_STATUS="$status"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'gitleaks.json'
          status = int(os.environ['SCAN_STATUS'])
          if status not in (0, 1) or not report.exists():
              raise SystemExit('Secret scan could not complete; inspect privately. No secret values were logged.')
          findings = json.loads(report.read_text()) or []
          print('Reachable commits:', subprocess.check_output(['git','rev-list','--all','--count'], text=True).strip())
          print('Secret-scan findings:', len(findings))
          for item in findings:
              print(json.dumps({k:item.get(k) for k in ('RuleID','File','StartLine','Fingerprint')}))
          raise SystemExit(status)
          PY
      - name: Reject tracked runtime secrets and database payloads
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          bad = [p for p in paths if p and (re.search(r'(^|/)(\.env(\..+)?|\.dev\.vars(\..+)?)$',p) and not p.endswith('.example') or re.search(r'\.(sqlite3?|db|pem|p12|pfx)$',p))]
          if bad:
              print('Prohibited tracked runtime/data paths:', ', '.join(bad))
              raise SystemExit(1)
          print('No tracked runtime environment files, private-key files, or database payloads found.')
          PY
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
